<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fulcrum wiring preview</title>
<style>
  body { margin: 0; padding: 24px; background: #f4f5f7; color: #1d232b; font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  figure { margin: 0 0 28px; }
  figcaption { font-weight: 700; margin: 0 0 8px; }
  img { display: block; width: 100%; max-width: 1060px; border: 1px solid #d6dce3; border-radius: 8px; background: #fff; }
</style>
</head>
<body>
<h1>Fulcrum wiring, step by step</h1>
<figure><figcaption>W1 · Power</figcaption><img src="img/wire-1.svg" alt="Power wiring"></figure>
<figure><figcaption>W2 · Servo and capacitor</figcaption><img src="img/wire-2.svg" alt="Servo wiring"></figure>
<figure><figcaption>W3 · Sonar</figcaption><img src="img/wire-3.svg" alt="Sonar wiring"></figure>
<figure><figcaption>W4 · Gyro</figcaption><img src="img/wire-4.svg" alt="Gyro wiring"></figure>
<figure><figcaption>W5 · Knob</figcaption><img src="img/wire-5.svg" alt="Knob wiring"></figure>
<figure><figcaption>W6 · LED face</figcaption><img src="img/wire-6.svg" alt="LED matrix wiring"></figure>
<figure><figcaption>W7 · IR receiver</figcaption><img src="img/wire-7.svg" alt="IR receiver wiring"></figure>
<figure><figcaption>W8 · Buzzer</figcaption><img src="img/wire-8.svg" alt="Buzzer wiring"></figure>
<figure><figcaption>Everything</figcaption><img src="img/wire-all.svg" alt="All wiring"></figure>
</body>
</html>
